# switch-lan-play-nx -- relay server list (max 10)
#
# Format (one server per line, '#' starts a comment):
#     <name> <host:port>      or      <name> <host> <port>
#
# This file is read by:
#   - the switch-lan-play-nx sysmodule (on-device: /config/switch-lan-play-nx/servers.conf)
#   - the switch-lan-play-nx Tesla overlay (same path)
# Keep names short; they appear in the overlay picker. Pick one with the
# overlay (L+DPad-Down by default) and press A -- no reboot needed, the
# bridge reconnects to the new relay immediately.

# local test relay (slp-server-rust) -- this is what RuntimeCfg falls back
# to automatically if this file is ever missing, so it's listed first here
# too for visibility.
local     10.102.227.153:11451

# lan-play server usa -- same public relay sys-slp-client's own
# config/servers.conf already lists. Numeric IP, NOT the "tekn0.net"
# hostname: DNS resolution (getaddrinfo) crashes the whole bridge process
# in this sysmodule context (confirmed live 2026-08-24, see relay_bridge.hpp's
# own comment on Connect()) -- guarded against crashing now, but a hostname
# entry still just fails to connect rather than actually working. A numeric
# IP sidesteps the whole broken code path.
