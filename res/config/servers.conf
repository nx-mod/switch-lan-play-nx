# switch-lan-play-nx -- relay server list (max 10)
#
# Format (one server per line, '#' starts a comment):
#     <name> <host:port>      or      <name> <host> <port>
#
# This file is read by:
#   - the switch-lan-play-nx sysmodule (on-device: /config/switch-lan-play-nx/servers.conf)
#   - the switch-lan-play-nx Tesla overlay (same path)
# Keep names short; they appear in the overlay picker. Pick one with the
# overlay (L+DPad-Down by default) and press A -- no reboot needed, the
# bridge reconnects to the new relay immediately.

